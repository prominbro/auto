name: Update Results

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: pip install requests pyyaml

      - name: Run checker
        run: python3 gemini_latency_checker.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Show results
        run: |
          echo "=== subip.txt ==="
          [ -f subip.txt ] && cat subip.txt || echo "нет файла"
          echo ""
          for f in wl.txt all.txt gemini.txt; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              echo "=== $f ==="
              wc -l < "$f"
            fi
          done

      - name: Commit & Push
        run: |
          git config user.name "auto-bot"
          git config user.email "auto@users.noreply.github.com"
          FILES=""
          for f in subip.json subip.txt wl.txt all.txt gemini.txt; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              FILES="$FILES $f"
            fi
          done
          if [ -z "$FILES" ]; then
            echo "Нет файлов с результатами"
            exit 0
          fi
          git add $FILES
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git diff --cached --quiet && echo "Нет изменений" && exit 0
          git commit -m "update: $TIMESTAMP"
          git push origin master
